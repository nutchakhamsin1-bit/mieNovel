# Static analysis configuration.
# https://dart.dev/guides/language/analysis-options
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Down-grade some noisy lints from info → ignore. These don't affect
    # runtime behaviour and the codebase has hundreds of legacy occurrences
    # that would obscure real issues during incremental cleanup.
    avoid_print: ignore
    use_build_context_synchronously: ignore
    unnecessary_brace_in_string_interps: ignore
    file_names: ignore
    library_private_types_in_public_api: ignore
    no_leading_underscores_for_local_identifiers: ignore
    unnecessary_underscores: ignore
    sized_box_for_whitespace: ignore
    use_super_parameters: ignore
    prefer_final_fields: ignore

linter:
  rules:
    # Keep deprecated_member_use ON — surfaces future-breaking APIs
    # (we already swept withOpacity → withValues in this branch).
